<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hola Vecino</title>
  <meta name="description" content="Guide, estimation du coût de la vie et communauté pour les expatriés en Espagne.">
  <meta property="og:title" content="¡Hola Vecino!">
  <meta property="og:image" content="logo-600.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1E4E8C">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <a class="skip" href="#view">↓</a>
  <header class="top">
    <div class="top-inner">
      <a href="#/" class="brand" aria-label="Hola Vecino"><img class="brand-img" src="logo-horizontal.png" alt="¡Hola Vecino!" width="470" height="120"><span id="brand" class="sr">Hola Vecino</span></a>
      <nav id="nav" class="nav" aria-label="Menu"></nav>
      <div class="right">
        <div id="account" class="account"></div>
        <div class="lang">
          <button id="langbtn" aria-haspopup="true" aria-expanded="false"></button>
          <ul id="langlist" hidden></ul>
        </div>
      </div>
    </div>
  </header>
  <main id="view" tabindex="-1"></main>
  <footer id="footer" class="footer"></footer>
  <div id="toast" class="toast" role="status" hidden></div>

  <!-- Formulaire de contact : copie invisible pour que Netlify le détecte (ne pas supprimer) -->
  <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input name="bot-field"><input name="name"><input name="email"><input name="subject"><textarea name="message"></textarea>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js"></script>
  <script src="config-extra.js"></script>
  <script src="i18n.js"></script>
  <script src="i18n-v2.js"></script>
  <script src="i18n-v3.js"></script>
  <script src="i18n-v4.js"></script>
  <script src="i18n-v5.js"></script>
  <script src="i18n-v6.js"></script>
  <script src="i18n-v7.js"></script>
  <script src="i18n-v8.js"></script>
  <script src="i18n-v9.js"></script>
  <script src="i18n-v10.js"></script>
  <script src="i18n-v11.js"></script>
  <script src="i18n-v12.js"></script>
  <script src="games-data.js"></script>
  <script src="guide.js"></script>
  <script src="content-v2.js"></script>
  <script src="events.js"></script>
  <script src="admin.js"></script>
  <script src="market.js"></script>
  <script src="engage.js"></script>
  <script src="v5.js"></script>
  <script src="wall.js"></script>
  <script src="friends.js"></script>
  <script src="games.js"></script>
  <script src="v9-tools.js"></script>
  <script src="v9-social.js"></script>
  <script src="v9-admin.js"></script>
  <script src="share.js"></script>
  <script src="app.js"></script>
</body>
</html>
